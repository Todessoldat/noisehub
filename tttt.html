<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrossel de 3 Imagens</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .carousel {
        position: relative;
        width: 80%;
        max-width: 600px;
        overflow: hidden;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .carousel-images {
        display: flex;
        transition: transform 0.5s ease-in-out;
        width: 300%; /* 3 imagens */
    }

    .carousel-images img {
        width: 100%;
        flex-shrink: 0;
    }

    /* Botões de navegação */
    .prev, .next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.5);
        color: white;
        border: none;
        padding: 10px;
        cursor: pointer;
        border-radius: 50%;
        font-size: 18px;
    }

    .prev { left: 10px; }
    .next { right: 10px; }

    .prev:hover, .next:hover {
        background: rgba(0,0,0,0.8);
    }
</style>
</head>
<body>

<div class="carousel">
    <div class="carousel-images" id="carousel-images">
        <img src="https://via.placeholder.com/600x300/ff7f7f/fff?text=Imagem+1" alt="Imagem 1">
        <img src="https://via.placeholder.com/600x300/7fbfff/fff?text=Imagem+2" alt="Imagem 2">
        <img src="https://via.placeholder.com/600x300/7fff7f/fff?text=Imagem+3" alt="Imagem 3">
    </div>
    <button class="prev" onclick="mudarSlide(-1)">&#10094;</button>
    <button class="next" onclick="mudarSlide(1)">&#10095;</button>
</div>

<script>
    let indice = 0;
    const imagens = document.getElementById("carousel-images");
    const totalSlides = imagens.children.length;

    function mostrarSlide() {
        imagens.style.transform = `translateX(${-indice * 100}%)`;
    }

    function mudarSlide(direcao) {
        indice = (indice + direcao + totalSlides) % totalSlides;
        mostrarSlide();
    }

    // Troca automática a cada 3 segundos
    setInterval(() => {
        mudarSlide(1);
    }, 3000);
</script>

</body>
</html>
