<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOISEHUB - Contato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
      background-color: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: #000;
      border-bottom: 1px solid #1a1a1a;
    }


    .nav-link {
      color: white;
      font-weight: bold;
      margin: 0 10px;
    }

    .nav-link:hover {
      color: #c40000;
    }

    .logo img {
       width: 250px;
    }

    .logo {
      display: inline-block;
    }

    .hero {
      min-height: 600px;
      background:
        linear-gradient(to right, #000 25%, rgba(0,0,0,0.7), rgba(0,0,0,0.2)),
        url("./image/backg/banner_contato.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
    }

    .hero h1 {
      font-size: 72px;
      font-weight: 900;
      line-height: 0.9;
    }

    .hero h1 span {
      color: #c40000;
    }

    .form-control {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: white;
    }

    .form-control:focus {
      background-color: #1a1a1a;
      color: white;
      border-color: #c40000;
      box-shadow: none;
    }

    .btn-rock {
      background-color: #c40000;
      color: white;
      font-weight: bold;
      border: none;
      padding: 12px 25px;
    }

    .btn-rock:hover {
      background-color: #8f0000;
      color: white;
    }

    footer {
      background-color: #000;
      color: #777;
      padding: 25px;
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-sm">

      <a class="logo" href="index.html">
        <img src="./image/logo/logo.png">
      </a>

      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="index.html">INÍCIO</a>
        <a class="nav-link" href="bandas.html">BANDAS</a>
        <a class="nav-link" href="#">NOTÍCIAS</a>
        <a class="nav-link" href="#">AGENDA</a>
        <a class="nav-link" href="contato.html">CONTATO</a>
      </div>

    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <div class="col-md-6">
      <h1>FAÇA SUA <span>BANDA APARECER</span></h1>
      <p class="lead">
        Quer ver sua banda no NoiseHub? Há alguma informação que você gostaria de compartilhar? Envie suas informações para nossa equipe!
      </p>
      </div>
    </div>
  </section>

  <section class="container my-5">

    <div>

      <h2 class="mb-4">Mande sua mensagem</h2>

      <form>

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" placeholder="Digite seu nome" required>
        </div>

        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" placeholder="Digite seu e-mail" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Telefone</label>
            <input type="tel" class="form-control" placeholder="Digite seu telefone" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Mensagem</label>
            <textarea class="form-control" rows="6" placeholder="Digite sua mensagem" required></textarea>
        </div>

        <button type="submit" class="btn btn-rock">
          ENVIAR MENSAGEM 🎸
        </button>

      </form>

    </div>

  </section>

  <footer>
    @NoiseHub - Todos os direitos reservados =)
  </footer>

</body>
</html>
