<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOISEHUB - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    
    body {
        background-image:
            linear-gradient(  rgba(0,0,0,0.8),rgba(0,0,0,0.8)),
            url("./image/backg/banner_login.jpg");
        color: white;
        background-size: cover;
        background-position: center;
        font-family: Arial, sans-serif;
    }

    .navbar {
      background-color: #000;
      border-bottom: 1px solid #1a1a1a;
    }

    .nav-link {
      color: white;
      font-weight: bold;
      margin: 0 10px;
    }

    .nav-link:hover {
      color: #c40000;
    }

    .logo img {
      width: 250px;
    }

    .logo {
      display: inline-block;
    }

    .login-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 100%;
      max-width: 500px;
      background-color: #111;
      border: 1px solid #222;
      padding: 40px;
      border-radius: 10px;
    }

    .login-logo {
        width: 280px;
        max-width: 100%;
    }

    .login-subtitle {
      text-align: center;
      color: #999999;
      margin-bottom: 30px;
    }

    .form-control {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: white;
    }

    .form-control:focus {
      background-color: #1a1a1a;
      color: white;
      border-color: #c40000;
      box-shadow: none;
    }

    .form-check-input:checked {
      background-color: #c40000;
      border-color: #c40000;
    }

    .btn-rock {
      background-color: #c40000;
      color: white;
      font-weight: bold;
      border: none;
      padding: 14px 28px;
    }


    .btn-rock:hover {
      background-color: #8f0000;
      color: white;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #999;
    }

    .register-link a {
      color: #c40000;
      text-decoration: none;
      font-weight: bold;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .modal-content {
        background-color: #080808;
        color: white;
        border: 1px solid #c40000;
    }

    footer {
      background-color: #000;
      color: #777;
      padding: 25px;
      text-align: center;
    }
  </style>
</head>

<body>
<!-- para de dar errado css pfv nao te peço mais nada-->
  <nav class="navbar navbar-expand-lg">
    <div class="container-sm">
      <a class="logo" href="index.html">
        <img src="./image/logo/logo.png">
      </a>

      <button class="navbar-toggler bg-danger" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li><a class="nav-link" href="index.html">INÍCIO</a></li>
        <li><a class="nav-link" href="bandas.html">BANDAS</a></li>
        <li><a class="nav-link" href="#">NOTÍCIAS</a></li>
        <li><a class="nav-link" href="#">AGENDA</a></li>
        <li><a class="nav-link" href="hallfama.html">HALL DA FAMA</a></li>
        <li><a class="nav-link" href="contato.html">CONTATO</a></li>
        <li><a class="btn btn-rock ms-3" href="login.html">LOGIN</a></li>
      </ul>
      </div>
    </div>
  </nav>

  <section class="login-section">

    <div class="login-box">

      <div class="text-center mb-4">
        <img src="./image/logo/logomembers.png" class="login-logo">
      </div>
        
      

      <p class="login-subtitle">
       <strong>Área exclusiva para membros do portal.</strong>
      </p>

      <form action="index.html">

        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input
            type="text"
            class="form-control"
            placeholder="Digite seu usuário"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input
            type="password"
            class="form-control"
            placeholder="Digite sua senha"
            required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox">
          <label class="form-check-label">
            Lembrar-me
          </label>
        </div>

        <button type="submit" class="btn btn-rock">
          ENTRAR 🎸
        </button>

      </form>

      <div class="register-link">
        Ainda não possui uma conta?
        <a href="# " data-bs-toggle="modal" data-bs-target="#cadastroModal">Cadastre-se</a>
      </div>

    </div>
<!-- arrumar identação de bosta-->
    <div class="modal fade" id="cadastroModal" tabindex="-1">
         <div class="modal-dialog modal-dialog-centered">
             <div class="modal-content p-4 modal-content">

                <h2>Cadastro NoiseHub</h2>

                <form action="login.html">

                     <div class="mb-3">
                      <label class="form-label">Nome</label>
                      <input type="text" class="form-control" required>
                     </div>

                     <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" required>
                     </div>

                     <div class="mb-3">
                        <label class="form-label">Usuário</label>
                        <input type="text" class="form-control" required>
                     </div>

                     <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" required>
                     </div>

                    <button type="submit" class="btn btn-rock">
                        CRIAR CONTA 🎸
                    </button>

                </form>

            </div>
         </div>
    </div>
</section>

  <footer>
    @NoiseHub - Todos os direitos reservados =)
  </footer>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
